[package]
name = "client"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "teeworlds-rs"
path = "src/main.rs"

[dependencies]
macroquad = "0.4"
shared = { workspace = true }
serde = { workspace = true }
postcard = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
sapp-jsutils = "0.1.7"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ewebsock = "0.8.0"
